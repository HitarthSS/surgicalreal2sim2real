name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (no GPU, data or API calls)
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q scene_pipeline
      - name: Check repository contents
        run: python scripts/check_repository.py
